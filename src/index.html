<canvas id=c style=position:fixed;inset:0></canvas><script>
const g=c.getContext("2d"),M=Math,N=Date.now
let w,h,px=0,pz=2,a=0,k={},tx,tz,pt=-1e4,pings=0,audio,found=0,fc=0,tp=0,fp=0

onresize=()=>{
  c.width=w=innerWidth
  c.height=h=innerHeight
}
onresize()

function target(){
  tx=(M.random()-.5)*10
  tz=M.random()*20-4
}
target()

function cam(X,Y,Z){
  let x=X-px,z=Z-pz,C=M.cos(a),S=M.sin(a)
  return[x*C-z*S,Y,x*S+z*C]
}

function scr(p){
  let f=M.min(w,h)*.8
  return[w/2+p[0]/p[2]*f,h/2+p[1]/p[2]*f]
}

function project(X,Y,Z){
  let p=cam(X,Y,Z)
  return p[2]>.1&&scr(p)
}

function line(x,y,z,X,Y,Z){
  let A=cam(x,y,z),B=cam(X,Y,Z),n=.1,t

  if(A[2]<n&&B[2]<n)return

  if(A[2]<n){
    t=(n-A[2])/(B[2]-A[2])
    A[0]+=(B[0]-A[0])*t
    A[1]+=(B[1]-A[1])*t
    A[2]=n
  }

  if(B[2]<n){
    t=(n-B[2])/(A[2]-B[2])
    B[0]+=(A[0]-B[0])*t
    B[1]+=(A[1]-B[1])*t
    B[2]=n
  }

  A=scr(A)
  B=scr(B)

  g.beginPath()
  g.moveTo(...A)
  g.lineTo(...B)
  g.stroke()
}

onkeydown=e=>{
  k[e.key.toLowerCase()]=1
  e.code=="Space"&&!e.repeat&&(e.preventDefault(),ping())
}

onkeyup=e=>k[e.key.toLowerCase()]=0

c.onclick=()=>c.requestPointerLock()

onmousemove=e=>
  document.pointerLockElement==c&&(a+=e.movementX*.002)

function sound(f,t=.2,v=.14){
  audio||=new AudioContext

  let o=audio.createOscillator()
  let q=audio.createGain()
  let n=audio.currentTime

  f=[].concat(f)

  for(let i in f)
    o.frequency.setValueAtTime(f[i],n+i*.12)

  q.gain.setValueAtTime(v,n)
  q.gain.exponentialRampToValueAtTime(.001,n+t)

  o.connect(q)
  q.connect(audio.destination)

  o.start()
  o.stop(n+t)
}

function dist(){
  return M.hypot(tx-px,tz-pz)
}

function ping(){
  pings++
  tp++
  pt=N()

  sound(M.max(180,950-dist()*45))
}

function move(){
  let s=.045
  let f=(k.w|k.arrowup)-(k.s|k.arrowdown)
  let r=(k.d|k.arrowright)-(k.a|k.arrowleft)

  px+=M.sin(a)*f*s+M.cos(a)*r*s
  pz+=M.cos(a)*f*s-M.sin(a)*r*s

  px=M.max(-5.6,M.min(5.6,px))
  pz=M.max(-5.6,M.min(17.6,pz))
}

function check(){
  let n=N()

  if(found){
    if(n>found){
      target()
      found=0
    }
    return
  }

  if(dist()<.45){
    found=n+1200

    fc++
    fp+=tp
    tp=0

    sound([650,1100,1500],.4,.18)
  }
}

function text(s,y,x=22){
  g.fillText(s,x,y)
}

function draw(){
  move()
  check()

  g.fillStyle="black"
  g.fillRect(0,0,w,h)

  g.strokeStyle="#173017"

  for(let i=-6;i<19;i++){
    i<7&&line(i,3,-6,i,3,18)
    line(-6,3,i,6,3,i)
  }

  g.strokeStyle="#386838"

  let R=[-6,-6,6,-6,6,18,-6,18]

for(let i=0;i<8;i+=2){
  let x=R[i],z=R[i+1]
  let X=R[(i+2)%8],Z=R[(i+3)%8]

  line(x,-3,z,X,-3,Z)
  line(x,-3,z,x,3,z)
}

  let age=N()-pt
  let d=dist()

  if(age<600){
    g.strokeStyle=`rgba(140,255,140,${1-age/600})`
    g.beginPath()
    g.arc(w/2,h/2,age*.55,0,7)
    g.stroke()
  }

  if(age<400){
    let t=project(tx,0,tz)

    if(t){
      g.fillStyle="#9f9"
      g.fillRect(t[0]-2,t[1]-2,4,4)

      g.strokeStyle="#9f9"
      g.beginPath()
      g.arc(t[0],t[1],7+age/25,0,7)
      g.stroke()
    }
  }

  g.font="14px monospace"

  g.fillStyle="#8f8"
  text("PING",30)

  g.fillStyle="#666"
  text("WASD  mouse  SPACE",52)
  text("pings "+pings,74)
  text("found "+fc,96)
  text("avg "+(fc?(fp/fc).toFixed(1):"-")+" pings",118)

  if(age<500){
    g.fillStyle="#8f8"

    text(
      d<.7?"SIGNAL FOUND":
      d<2?"very close":
      d<5?"closer...":
      "weak signal",
      140
    )
  }

  if(found){
    let l=found-N()

    g.fillStyle=`rgba(120,255,120,${l/4000})`
    g.fillRect(0,0,w,h)

    g.textAlign="center"
    g.font="bold 28px monospace"
    g.fillStyle="#bfb"
    text("SIGNAL FOUND",h/2-35,w/2)

    g.font="13px monospace"
    g.fillStyle="#8f8"
    text("relocating",h/2-12,w/2)

    g.textAlign="left"
  }

  g.strokeStyle="#888"
  g.beginPath()
  g.moveTo(w/2-5,h/2)
  g.lineTo(w/2+5,h/2)
  g.moveTo(w/2,h/2-5)
  g.lineTo(w/2,h/2+5)
  g.stroke()

  requestAnimationFrame(draw)
}

draw()
</script>
